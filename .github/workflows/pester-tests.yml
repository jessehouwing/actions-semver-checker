name: Pester Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  unit-tests:
    name: Run Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run Unit Tests
        shell: pwsh
        run: |
          # Save the original step summary content
          $originalSummary = $null
          if ($env:GITHUB_STEP_SUMMARY -and (Test-Path $env:GITHUB_STEP_SUMMARY)) {
            $originalSummary = Get-Content -Path $env:GITHUB_STEP_SUMMARY -Raw -ErrorAction SilentlyContinue
          }

          # Run unit tests with test result output
          Import-Module Pester -ErrorAction Stop
          $config = [PesterConfiguration](Import-PowerShellDataFile -Path './pester.config.psd1')
          $config.Run.Path = @(
            './tests/unit/**/*.Tests.ps1'
            './tests/cli/**/*.Tests.ps1'
            './lib/actions/**/*.Tests.ps1'
            './lib/rules/**/*.Tests.ps1'
          )
          $config.TestResult.Enabled = $true
          $config.TestResult.OutputPath = 'unit-test-results.xml'
          $config.TestResult.OutputFormat = 'NUnitXml'
          $config.Output.Verbosity = 'Detailed'
          $config.Run.Exit = $true

          $stopMarker = (New-Guid).Guid
          Write-Output "::stop-commands::$stopMarker"
          Invoke-Pester -Configuration $config
          Write-Output "::$stopMarker::"

          # Restore the original step summary content
          if ($env:GITHUB_STEP_SUMMARY) {
            if ($originalSummary) {
              Set-Content -Path $env:GITHUB_STEP_SUMMARY -Value $originalSummary -NoNewline -Force
            } else {
              Clear-Content -Path $env:GITHUB_STEP_SUMMARY -Force -ErrorAction SilentlyContinue
            }
          }

      - name: Upload Unit Test Results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: unit-test-results
          path: unit-test-results.xml

      - name: Publish Unit Test Results
        uses: EnricoMi/publish-unit-test-result-action@d0a4676d0e0b938bc201470d88276b7c74c712b3 # v2
        if: always()
        with:
          files: unit-test-results.xml
          check_name: Unit Tests
          comment_mode: off

