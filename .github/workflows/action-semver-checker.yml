name: Check SemVer

on:
  push:
    branches: [ "main" ]
    tags:
      - '*'
  workflow_dispatch:

permissions:
  # contents: write is required to see draft releases via the API
  # Without it, draft releases are not visible and will be reported as "missing"
  contents: write

jobs:
  check-semver:
    concurrency:
      group: '${{ github.workflow }}'
      cancel-in-progress: true
      
    runs-on: ubuntu-latest
    steps:
      - name: Harden the runner (Audit all outbound calls)
        uses: step-security/harden-runner@9af89fc71515a100421586dfdb3dc9c984fbf411 # v2.19.4
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./
        with:
          check-minor-version: error
          check-release-immutability: error
          ignore-preview-releases: true
          check-releases: true
          token: ${{ secrets.GITHUB_TOKEN }}
          auto-fix: true
